<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/public/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LovelyERes - Linux Emergency Response Tool</title>
  <meta name="description" content="Linux应急响应工具，支持SSH连接、终端操作、文件管理和Docker容器管理" />

  <style>
    /* 防止页面闪烁的基础样式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a2e;
      color: #e2e8f0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Loading screen styles */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease-out;
    }

    .loading-content {
      text-align: center;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
    }

    .logo-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: rotate 3s linear infinite;
    }

    .logo-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      background: linear-gradient(45deg, #4cc9f0, #4361ee);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(76, 201, 240, 0.5);
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .app-title {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #4cc9f0, #4361ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loading-bar-container {
      width: 300px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin: 10px auto;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4cc9f0, #4361ee);
      animation: progress 2s ease-in-out infinite;
      animation-delay: 0.3s;
    }

    @keyframes progress {
      0% {
        width: 0%;
      }

      50% {
        width: 70%;
      }

      100% {
        width: 100%;
      }
    }

    .loading-text {
      color: #a9d6e5;
      margin-top: 15px;
      font-size: 1rem;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <!-- Initial loading screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="logo-container">
        <div class="logo-ring"></div>
        <div class="logo-circle"></div>
      </div>
      <div class="app-title">LovelyRes</div>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
      <div class="loading-text">正在初始化系统...</div>
      <div class="loading-text" id="backend-status">请确保Python后端服务已启动</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>

  <script>
    // Check if Python backend is accessible
    (async () => {
      try {
        const response = await fetch('http://127.0.0.1:3001/health');
        const data = await response.json();

        if (data.status === 'ok') {
          document.getElementById('backend-status').textContent = 'Python后端连接成功';
          document.getElementById('backend-status').style.color = '#4cc9f0';
        } else {
          document.getElementById('backend-status').textContent = '警告：Python后端连接失败';
          document.getElementById('backend-status').style.color = '#fca5a5';
        }
      } catch (error) {
        console.error('无法连接到Python后端:', error);
        document.getElementById('backend-status').textContent = '错误：无法连接到Python后端';
        document.getElementById('backend-status').style.color = '#fca5a5';
      }
    })();
  </script>
</body>

</html>
